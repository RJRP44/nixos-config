devices: (
{
	name: "Wireless Mouse MX Master 2S";
	dpi: 50;
hiresscroll:
{
    hires: true;
    invert: false;
    target: false;
    up: {
        mode: "Axis";
        axis: "REL_WHEEL_HI_RES";
        axis_multiplier: 0.5;
    },
    down: {
        mode: "Axis";
        axis: "REL_WHEEL_HI_RES";
        axis_multiplier: -0.5;
    },
}
	buttons: (
	 { cid: 0xc3; 
	action = {
 	   	  type: "Keypress";
		  keys: ["KEY_T"];
};
    });
}
);

